[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.bestwinnervn.com/*"
  to = "https://bestwinnervn.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bestwinnervn.com/*"
  to = "https://bestwinnervn.com/:splat"
  status = 301
  force = true

# 페이지별 HTML(dist/<경로>/index.html)은 빌드 시 생성되어 그대로 제공됨.
# 등록되지 않은 주소는 404 상태로 응답 (검색엔진 soft 404 방지).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
